name: Tests on all platforms with linting

on: [pull_request]

env:
  AEQ_SHOW_PROGRESS: "0"

jobs:
  linting:
    runs-on: ubuntu-latest
    name: Linting
    env:
      UV_NO_PROJECT: "1"

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Set Python environment
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'

      - name: Install LLVM tools
        run: |
          sudo apt update
          sudo apt install -y clang-tidy clang-format

      - name: Install lint and build dependencies
        run: |
          uv venv --python 3.13 --python-preference only-managed --clear
          uv pip install --group build --group tests

      - name: Configure compilation database
        run: uv run meson setup build

      - name: Run lint checks
        run: uv run spin lint

  testing:
    needs: linting
    name: Testing on ${{ matrix.os }}, Python ${{ matrix.python-version }}${{ matrix.sanitisers && ', with sanitisers enabled' || ' '  }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}-sanitisers=${{ matrix.sanitisers }}
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [windows-latest, ubuntu-latest, macos-latest]
        sanitisers: [false]
        exclude:
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
        include:
          - os: ubuntu-latest
            python-version: '3.13'
            sanitisers: true

      max-parallel: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set Python environment
      uses: astral-sh/setup-uv@v10.0.1
      with:
          python-version: ${{ matrix.python-version }}

    - name: Download llvm and spatialite tools on macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm libspatialite

    - name: Download spatialite on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libspatialite-dev libsqlite3-mod-spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Install Python and create virtual environment
      run: uv venv --python ${{ matrix.python-version }} --python-preference only-managed --clear

    - name: Activate virtualenv
      if: matrix.os != 'windows-latest'
      run: |
        . .venv/bin/activate
        echo PATH=$PATH >> $GITHUB_ENV

    - name: Activate virtualenv (windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\.venv\Scripts\Activate.ps1
        "$env:PATH" | Out-File -FilePath "$env:GITHUB_PATH" -Append

    - name: Download spatialite on Windows
      if: matrix.os == 'windows-latest'
      run: python tests/setup_windows_spatialite.py

    - name: Setup environment variables (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo AEQ_SPATIALITE_DIR=/opt/homebrew/lib >> $GITHUB_ENV
        echo CXX=/opt/homebrew/opt/llvm/bin/clang++ >> $GITHUB_ENV
        echo CC=/opt/homebrew/opt/llvm/bin/clang >> $GITHUB_ENV

    - name: Compile and test
      if: matrix.sanitisers == false
      run: |
        uv pip install --group tests '.[create]' -Ccompile-args=-v
        # We use pytest directly rather than spin test here to test the installed wheel rather than the meson build.
        python -P -m pytest -n 8 -v tests/ --random-order-bucket=global --random-order --durations=50 --max-worker-restart=0

    - name: Compile and test (sanitisers)
      if: ${{ matrix.sanitisers == true && matrix.os == 'ubuntu-latest' }}
      run: |
        uv pip install --group tests '.[create]' -Ccompile-args=-v -Csetup-args="-Dbuildtype=debug" -Csetup-args="-Db_sanitize=address,undefined"
        export ASAN_OPTIONS=detect_leaks=1
        export LSAN_OPTIONS=suppressions=$(readlink -f .github/workflows/asan_suppressions.txt)
        # https://github.com/google/sanitizers/issues/934#issuecomment-1800125367
        LD_PRELOAD="$(realpath "$(gcc -print-file-name=libasan.so)") $(realpath "$(gcc -print-file-name=libstdc++.so)")" python -P -m pytest -n 0 -s tests/
