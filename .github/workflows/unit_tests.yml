name: Tests on all platforms with linting

on: [pull_request]

env:
  AEQ_SHOW_PROGRESS: "0"

jobs:
  linting:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Set Python environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv pip install ruff==0.9.10 black==25.1.0

      - name: Lint with ruff
        run: ruff check .

      - name: Check code format with Black
        run: black --check .

  testing:
    needs: linting
    runs-on: ${{ matrix.os}}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13'] # '3.9', 
        os: [windows-latest, ubuntu-latest, macos-latest]

      max-parallel: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set Python environment
      uses: astral-sh/setup-uv@v7
      with:
          python-version: ${{ matrix.python-version }}

    - name: Download llvm and spatialite tools on macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm
        brew install spatialite-tools

    - name: Install dependencies (windows)
      if: matrix.os == 'windows-latest'
      run: |
        uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed
        .venv/Scripts/activate
        uv pip install -e .[dev]
    
    - name: Install dependencies (linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed
        source .venv/bin/activate
        uv pip install -e .[dev]

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed
        source .venv/bin/activate
        uv pip install -e .[dev]    
      env:
        CXX: /opt/homebrew/opt/llvm/bin/clang++
        CC: /opt/homebrew/opt/llvm/bin/clang

    - name: Download spatialite on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install libsqlite3-mod-spatialite
        sudo apt install -y libspatialite-dev
        source .venv/bin/activate
        uv pip install spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Download spatialite on Windows
      if: matrix.os == 'windows-latest'
      run: |
        .venv/Scripts/activate
        python tests/setup_windows_spatialite.py

    - name: Runs test (windows)
      if: matrix.os == 'windows-latest'
      run: |
        .venv/Scripts/activate
        pytest tests/ --durations=50 --dist=loadscope -n 4 --random-order --verbose
    
    - name: Runs test (linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        source .venv/bin/activate
        pytest tests/ --durations=50 --dist=loadscope -n 4 --random-order --verbose

    - name: Runs test (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        source .venv/bin/activate
        pytest tests/ --durations=50 --dist=loadscope -n 4 --random-order --verbose
      env:
        DYLD_LIBRARY_PATH: /opt/homebrew/lib:$DYLD_LIBRARY_PATH
