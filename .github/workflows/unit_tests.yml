name: Tests on all platforms with linting

on: [pull_request]

env:
  AEQ_SHOW_PROGRESS: "0"

jobs:
  linting:
    runs-on: ubuntu-latest
    name: Linting
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Set Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.1
          args: check --output-format=github

  cython-lint:
    runs-on: ubuntu-latest
    name: cython-lint
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cython-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Set UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'

      - name: Run cython-lint
        run: |
          set +e  # We want to save the exit code of cython-lint for later
          uvx cython-lint==0.21.0 ./src/ > cython-lint-errors.txt
          export CYTHON_LINT_EXIT=$?
          # Echo cython errors in a format GitHub can understand
          sed -E 's|^([^:]+):([0-9]+):([0-9]+): (.+)$|::error title=cython-lint,file=\1,line=\2,col=\3,endLine=\2,endColumn=\3::\1:\2:\3: \4|' cython-lint-errors.txt
          exit $CYTHON_LINT_EXIT

  clang-tidy:
    runs-on: ubuntu-latest
    name: clang-tidy
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-clang-tidy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-tidy
        run: |
          sudo apt update
          sudo apt install -y clang-tidy

      - name: Set Python environment
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: uv venv --python 3.13 --python-preference only-managed --clear && uv pip install meson ninja cython cysignals

      - name: Configure build (generates compile_commands.json)
        run: |
          . .venv/bin/activate
          meson setup build

      - name: Run clang-tidy on src/
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-tidy -p build --quiet --warnings-as-errors='*'

  clang-format:
    runs-on: ubuntu-latest
    name: clang-format
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-clang-format
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt update
          sudo apt install -y clang-format

      - name: Check formatting of src/
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  testing:
    needs: linting
    name: Testing on ${{ matrix.os }}, Python ${{ matrix.python-version }}${{ matrix.sanitisers && ', with sanitisers enabled' || ' '  }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}-sanitisers=${{ matrix.sanitisers }}
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [windows-latest, ubuntu-latest, macos-latest]
        sanitisers: [false]
        exclude:
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            sanitisers: true

      max-parallel: 20
    steps:
    - uses: actions/checkout@v6
    - name: Set Python environment
      uses: astral-sh/setup-uv@v9.0.0
      with:
          python-version: ${{ matrix.python-version }}

    - name: Download llvm and spatialite tools on macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm libspatialite

    - name: Download spatialite on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libspatialite-dev libsqlite3-mod-spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Download spatialite on Windows
      if: matrix.os == 'windows-latest'
      run: uv run tests/setup_windows_spatialite.py

    - name: Install Python and create virtual environment
      run: uv venv --python ${{ matrix.python-version }} --python-preference only-managed --clear

    - name: Activate virtualenv
      if: matrix.os != 'windows-latest'
      run: |
        . .venv/bin/activate
        echo PATH=$PATH >> $GITHUB_ENV

    - name: Activate virtualenv (windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\.venv\Scripts\Activate.ps1
        "$env:PATH" | Out-File -FilePath "$env:GITHUB_PATH" -Append

    - name: Setup environment variables (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo AEQ_SPATIALITE_DIR=/opt/homebrew/lib >> $GITHUB_ENV
        echo CXX=/opt/homebrew/opt/llvm/bin/clang++ >> $GITHUB_ENV
        echo CC=/opt/homebrew/opt/llvm/bin/clang >> $GITHUB_ENV

    - name: Compile and test
      if: matrix.sanitisers == false
      run: |
        uv pip install ".[dev]" -v -Ccompile-args=-v
        pytest tests/ --durations=50 --dist=loadscope -n 4 --max-worker-restart 0 --random-order --verbose

    - name: Compile and test (sanitisers)
      if: ${{ matrix.sanitisers == true && matrix.os == 'ubuntu-latest' }}
      run: |
        uv pip install ".[dev]" -v -Ccompile-args=-v -Csetup-args="-Dbuildtype=debug" -Csetup-args="-Db_sanitize=address,undefined"
        export ASAN_OPTIONS=detect_leaks=1
        export LSAN_OPTIONS=suppressions=$(readlink -f .github/workflows/asan_suppressions.txt)
        LD_PRELOAD=$(gcc -print-file-name=libasan.so) pytest tests/
