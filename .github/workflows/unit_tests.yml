name: Tests on all platforms with linting

on: [pull_request]

permissions:
  contents: read

env:
  AEQ_SHOW_PROGRESS: "0"

jobs:
  linting:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.14.8
          args: check --output-format=github

  testing:
    needs: linting
    runs-on: ${{ matrix.os}}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [windows-latest, ubuntu-latest, macos-latest]
        exclude:
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'

      max-parallel: 20
    steps:
    - uses: actions/checkout@v6
    - name: Set Python environment
      uses: astral-sh/setup-uv@v7
      with:
          python-version: ${{ matrix.python-version }}

    - name: Download llvm and spatialite tools on macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm libspatialite

    - name: Download spatialite on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libspatialite-dev libsqlite3-mod-spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Download spatialite on Windows
      if: matrix.os == 'windows-latest'
      run: |
        uv run tests/setup_windows_spatialite.py

    - name: Install Python and create virtual environment
      run: uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed  --clear

    - name: Install dependencies (Windows & Linux)
      if: matrix.os != 'macos-latest'
      run: uv pip install -e ".[dev]"

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: CXX=$(brew --prefix llvm)/bin/clang++ CC=$(brew --prefix llvm)/bin/clang uv pip install -e ".[dev]"

    - name: Runs test (Windows & Linux)
      if: matrix.os != 'macos-latest'
      run: uv run pytest tests/ --durations=50 --dist=loadscope -n 4 --random-order --verbose

    - name: Runs test (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        uv pip uninstall pytest-xdist
        DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:$(brew --prefix)/lib uv run pytest tests/ --durations=50 --random-order --verbose

  testing_asan:
    needs: linting
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}-asan
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: ['3.13']
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      AEQ_ASAN: "1"
      PYTHONMALLOC: "malloc"
    steps:
    - uses: actions/checkout@v6
    - name: Set Python environment
      uses: astral-sh/setup-uv@v7
      with:
          python-version: ${{ matrix.python-version }}

    - name: Download spatialite on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libspatialite-dev libsqlite3-mod-spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Download llvm and spatialite tools on macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm libspatialite

    - name: Download spatialite on Windows
      if: matrix.os == 'windows-latest'
      run: |
        uv run tests/setup_windows_spatialite.py

    - name: Install Python and create virtual environment
      run: uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed  --clear

    - name: Set up MSVC environment (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $vsdev = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\Common7\Tools\VsDevCmd.bat" | Select-Object -First 1
        if (-not $vsdev) {
          throw "VsDevCmd.bat not found"
        }
        $cmd = '"' + $vsdev.FullName + '" -arch=x64 >nul && set'
        cmd /c $cmd | ForEach-Object {
          if ($_ -match "^(INCLUDE|LIB|LIBPATH|PATH|VCToolsInstallDir|VCToolsRedistDir)=(.*)$") {
            "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: uv pip install -e ".[dev]"

    - name: Add ASAN runtime to PATH (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $candidate_dirs = @(
          "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64",
          "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\LLVM\x64\bin",
          "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\LLVM\x64\lib\clang\*\lib\windows",
          "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.OpenMP"
        )
        $resolved_dirs = @()
        foreach ($pattern in $candidate_dirs) {
          $resolved_dirs += Get-Item -Path $pattern -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
        }
        $resolved_dirs = $resolved_dirs | Select-Object -Unique
        $has_asan_dll = $resolved_dirs | ForEach-Object { Test-Path (Join-Path $_ "clang_rt.asan_dynamic-x86_64.dll") } | Where-Object { $_ } | Select-Object -First 1
        if (-not $has_asan_dll) {
          throw "ASAN runtime DLL not found. Verify VS2022 C++ tooling is available on the runner."
        }
        "PATH=$($resolved_dirs -join ';');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: uv pip install -e ".[dev]"
      env:
        AEQ_UBSAN: "1"

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: CXX=$(brew --prefix llvm)/bin/clang++ CC=$(brew --prefix llvm)/bin/clang uv pip install -e ".[dev]"
      env:
        AEQ_UBSAN: "1"

    - name: Runs test with ASAN (Windows)
      if: matrix.os == 'windows-latest'
      run: uv run pytest tests/ --durations=50 --dist=loadscope -n 4 --random-order --verbose

    - name: Runs test with ASAN/UBSAN (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: uv run pytest tests/ --durations=50 --dist=loadscope -n 4 --random-order --verbose
      env:
        ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
        LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/asan.supp:exitcode=1"
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    - name: Runs test with ASAN/UBSAN (macOS, serial)
      if: matrix.os == 'macos-latest'
      run: |
        uv pip uninstall pytest-xdist
        DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:$(brew --prefix)/lib uv run pytest tests/ --durations=50 --random-order --verbose
      env:
        ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
        LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/asan.supp:exitcode=1"
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
