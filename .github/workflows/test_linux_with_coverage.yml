name: Code coverage

on: [pull_request]

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
    strategy:
      matrix:
        python-version: [3.11]
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install libsqlite3-mod-spatialite
        sudo apt install -y libspatialite-dev
        curl -LsSf https://astral.sh/uv/install.sh | sh
        PATH="/root/.local/bin/:$PATH"
        uv venv .venv
        .venv/bin/activate
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite
    - name: Compile library
      run: |
        uv pip install .[dev]
        python setup.py build_ext --inplace

    - name: Generate coverage report
      run: |
        python -m pytest --cov=aequilibrae tests/
