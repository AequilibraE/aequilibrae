name: Code coverage

on: [pull_request]

jobs:
  testing:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: [3.13]
    steps:
      - uses: actions/checkout@v7

      - name: Set Python environment
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download spatialite on Linux
        run: |
          sudo apt update
          sudo apt install -y libspatialite-dev libsqlite3-mod-spatialite
          sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

      - name: Install Python and create virtual environment
        run: uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed

      - name: Install test dependencies
        run: |
          uv pip install -r pyproject.toml --extra create --group build --group tests
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate coverage report
        run: |
          spin test --coverage -j 4 -v -- tests/ \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=markdown-append:$GITHUB_STEP_SUMMARY \
            --dist=loadscope \
            --random-order

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: html-coverage-artifact
          path: ./build/coverage/
