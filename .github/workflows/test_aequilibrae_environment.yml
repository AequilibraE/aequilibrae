name: Testing on QAequilibraE environment

on: [pull_request]

env:
  QGIS_RELEASE: true


jobs:
  testing:
    runs-on: windows-latest
    env:
      HAS_SECRETS: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
    strategy:
      matrix:
        python-version: [3.12]
    steps:
    - uses: actions/checkout@v7

    - name: Set Python environment
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python and create virtual environment
      run: uv venv .venv --python ${{ matrix.python-version }} --python-preference only-managed

    - name: Install dependencies
      run: |
        uv pip install -r pyproject.toml --extra create --group dev
        uv pip install numpy==2.4.6 --force-reinstall

    - name: Activate virtualenv (windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\.venv\Scripts\Activate.ps1
        "$env:PATH" | Out-File -FilePath "$env:GITHUB_PATH" -Append


    - name: Download spatialite on Windows
      if: matrix.os == 'windows-latest'
      run: spin python tests/setup_windows_spatialite.py

    - name: Runs test
      run: spin test -j 4 -v -- tests/ --durations=50 --dist=loadscope --random-order-bucket=global --random-order
